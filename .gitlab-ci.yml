# GitLab CI for the native Mojo SLC — mirrors .github/workflows/ci.yml.
#
# Designed for a SHELL executor on a host that has Docker (every job shells out
# to `docker`, exactly like the steps verified locally). Register the runner with
# `--executor shell` and "run untagged jobs" enabled (see the repo notes / chat).
# If you instead use a Docker executor you'll need docker-in-docker (dind); ask
# for that variant.

stages: [lint, security, test]

variables:
  GIT_DEPTH: "20"          # shallow clone is fine; gitleaks scans files (--no-git)
  DOCKER_BUILDKIT: "1"     # --output type=local (tarball job) needs BuildKit

shellcheck:
  stage: lint
  script:
    - docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable install-native.sh test/language_definitions_test.sh test/language_definitions_fixtures_test.sh test/slc_tarball_test.sh

hadolint:
  stage: lint
  # DL3008 apt pin (base is digest-pinned), DL3042 pip cache (build-only),
  # DL4006 pipefail (RUN pipes are guarded) — deliberately ignored.
  script:
    - docker run --rm -i hadolint/hadolint:2.12.0 hadolint --ignore DL3008 --ignore DL3042 --ignore DL4006 - < Dockerfile

python-syntax:
  stage: lint
  script:
    - docker run --rm -v "$PWD:/w" -w /w python:3.13-slim
        python -m py_compile test/fake_exasol.py test/diag_probe.py
        test/e2e/e2e_test.py python/pyudf/__init__.py python/pyudf/transform.py

gitleaks:
  stage: security
  script:
    - docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4
        detect --source /repo --no-git --no-banner --redact

dep-audit:
  stage: security
  script:
    - |
      if grep -qvE '^[[:space:]]*(#.*)?$' requirements.txt; then
        docker run --rm -v "$PWD:/w" -w /w python:3.13-slim \
          sh -c "pip install --root-user-action=ignore pip-audit && python -m pip_audit -r requirements.txt"
      else
        echo "requirements.txt has no packages — nothing to audit"
      fi

contracts:
  stage: test
  # language-definitions shape check on the committed document + fixtures driver
  # (one fixture per defect class proves each assertion discriminates).
  script:
    - |
      docker run --rm -v "$PWD:/w" -w /w debian:trixie-slim bash -c '
        apt-get update -qq && apt-get install -y -qq --no-install-recommends jq >/dev/null
        bash test/language_definitions_test.sh build_info/language_definitions.json
        bash test/language_definitions_fixtures_test.sh
      '

unit-tests:
  stage: test
  # Pure codec unit tests (src/proto.mojo + src/wire.mojo), compiled and run in
  # the Mojo builder image (the analogue of the Rust SLC's per-module unit tests).
  script:
    - docker build -f Dockerfile --target unittest --progress=plain .

selftest:
  stage: test
  # Builds the SLC (Mojo + bundled CPython) and drives the real binary through
  # the full protocol matrix (DOUBLE_MOJO int64+NUMERIC, SUM_POSITIVE, PY_SCALE)
  # plus multi-batch accumulation (--splits).
  script:
    - docker build -f Dockerfile --target selftest --progress=plain .

tarball:
  stage: test
  # Build the shippable SLC tarball and assert the extracted rootfs satisfies the
  # sandbox contract (mirrors the Rust SLC's slc_tarball_test.sh).
  script:
    - mkdir -p out-lc
    - docker build -f Dockerfile --target artifact --output type=local,dest=out-lc .
    - |
      docker run --rm -v "$PWD:/w" -w /w debian:trixie-slim bash -c '
        apt-get update -qq && apt-get install -y -qq --no-install-recommends binutils jq >/dev/null
        bash test/slc_tarball_test.sh out-lc/mojo-slc.tar.gz
      '
  artifacts:
    paths: [out-lc/mojo-slc.tar.gz]
    expire_in: 1 day
